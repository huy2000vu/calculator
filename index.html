<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div class="calculator">
      <div class="display">placeholder</div>

      <div class="row">
        <button class="clear">AC</button>
        <button class="negation">+/-</button>
        <button class="modulus">%</button>
        <button class="division basicOperator">/</button>
      </div>

      <div class="row">
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="multiplication basicOperator">x</button>
      </div>

      <div class="row">
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="subtraction basicOperator">-</button>
      </div>

      <div class="row">
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="addition basicOperator">+</button>
      </div>

      <div class="row lastrow">
        <button class="number">0</button>
        <button>.</button>
        <button class="calulate basicOperator">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
